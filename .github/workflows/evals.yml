name: Assistant evals

on:
  schedule:
    - cron: "41 4 * * 1" # weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: Live evals against production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run evals against production (key stays in Vercel)
        env:
          EVAL_BASE_URL: https://rishabh-verma.vercel.app
        run: npx vitest run evals
